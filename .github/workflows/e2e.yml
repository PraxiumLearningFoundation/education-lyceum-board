# End-to-end tests and demo recordings.
#
# Every push and pull request to dev or main runs the Playwright suite at desktop and
# 360px, then records the demo videos and uploads them as the "demo-videos" artifact.
# Each publish to main also refreshes the rolling "demos" release, so the latest videos
# have a stable place to be found. The videos are never committed (see demos/README.md).
name: E2E and demos

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end suite (desktop and 360px)
        run: npm run test:e2e
      - name: Record the demo videos into demos/
        run: npm run demos
      - name: Upload the demo videos
        uses: actions/upload-artifact@v5
        with:
          name: demo-videos
          path: demos/*.webm
          if-no-files-found: error
          retention-days: 30
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  release-demos:
    # Only a publish to main refreshes the public release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: demo-videos
          path: demos
      - name: Refresh the "demos" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          NOTES="Demo recordings of the board as published at ${SHA}. Rebuilt on every publish to main; see demos/README.md."
          if gh release view demos --repo "$REPO" >/dev/null 2>&1; then
            gh release edit demos --repo "$REPO" --target "$SHA" --notes "$NOTES"
          else
            gh release create demos --repo "$REPO" --target "$SHA" --title "Demo recordings" --notes "$NOTES"
          fi
          gh release upload demos demos/*.webm --repo "$REPO" --clobber
