<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Lyceum - Community Inquiry Board</title>
  <!-- Relative paths, because the board is served from a project subpath on GitHub
       Pages (/education-lyceum-board/) and may later move to an Azure web app at the
       root. An absolute "/favicon.webp" would 404 on Pages. -->
  <link rel="icon" type="image/webp" href="./favicon.webp" />
  <!-- Safari ignores WebP favicons in some versions, and Apple devices ask for this
       name by default; the PNG serves as both the fallback and the touch icon. -->
  <link rel="apple-touch-icon" href="./StarLogo.png" />
  <link rel="stylesheet" href="./board.css" />
</head>
<body class="bg-lyceum-50 text-stone-800 antialiased">
  <div id="notice"></div>
  <div id="app"></div>


  <script>
  // ------------------------------------------------------------------ helpers
  const $app = document.getElementById('app');
  const $notice = document.getElementById('notice');

  // ---------------------------------------------------------------- the archive
  // data/lyceum.json is the single source of truth. It is fetched at runtime so
  // that adding a gathering never means editing this file.
  const DATA_URL  = './data/lyceum.json';
  const CACHE_KEY = 'lyceum.archive.v2';

  // Where the archive lives when this page is NOT being served from its own repository.
  //
  // Copying the board's markup into a Squarespace code block is a stated goal, and it
  // separates the two halves: the HTML ends up on squarespace.com while the data stays
  // on Pages, so the relative path above resolves against the host page and 404s. That
  // is the exact failure reported from a working code block - "the archive returned
  // HTTP 404" - and it is not a Squarespace problem, it is a relative-path problem.
  //
  // Safe to read cross-origin: GitHub Pages answers with "access-control-allow-origin: *",
  // checked against the live host. Tried only after the relative path fails, so a normal
  // visit costs no extra request.
  //
  // A fork should point this at its own Pages URL, or set it to null to disable the
  // fallback entirely.
  const DATA_URL_FALLBACK =
    'https://praxiumlearningfoundation.github.io/education-lyceum-board/data/lyceum.json';

  // The stylesheet has the same problem as the archive, and it is more visible: copied
  // markup on another origin cannot reach "./board.css" either, so the page renders as
  // raw HTML - tags running together with no spacing, the beat strip falling back to a
  // numbered list, nothing laid out. Same fix, same reasoning.
  const CSS_URL_FALLBACK =
    'https://praxiumlearningfoundation.github.io/education-lyceum-board/board.css';

  // Did our stylesheet actually apply? `bg-lyceum-900` is one of this project's own theme
  // colours, so it exists in board.css and nowhere else - if a probe carrying it has no
  // background, the stylesheet did not load and the fallback is appended.
  //
  // Safe to test synchronously: a <link rel="stylesheet"> in <head> is render-blocking,
  // so by the time this inline script runs at the end of <body> the browser has already
  // resolved it either way.
  function ensureStylesheet(){
    const probe = document.createElement('div');
    probe.className = 'bg-lyceum-900';
    probe.style.position = 'absolute';
    probe.style.left = '-9999px';
    document.body.appendChild(probe);
    const bg = getComputedStyle(probe).backgroundColor;
    probe.remove();
    const applied = bg && bg !== 'transparent' && !/rgba\(0,\s*0,\s*0,\s*0\)/.test(bg);
    if (applied) return false;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = CSS_URL_FALLBACK;
    document.head.appendChild(link);
    return true;
  }

  let DATA = [];

  // Accepts the v2 envelope {schemaVersion, inquiries} and a bare array, so an
  // older or newer file shape cannot blank the page.
  function normalise(payload){
    const list = Array.isArray(payload) ? payload
               : (payload && Array.isArray(payload.inquiries)) ? payload.inquiries
               : [];
    return list.slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
  }

  // A section item is either a plain string (v1) or {text, attribution, at} (v2).
  // Item text is trusted, curated HTML - some records carry reference links.
  function itemText(i){
    if (i == null) return '';
    return (typeof i === 'object') ? String(i.text || '') : String(i);
  }
  function sectionItems(d){
    return SECTIONS.flatMap(([k]) => (d[k] || []).map(itemText));
  }

  function readCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const c = JSON.parse(raw);
      return (c && c.payload) ? c : null;
    } catch { return null; }
  }

  // The relative path first, because that is correct whenever the page is served from
  // the repository. Only if it fails do we reach for the canonical copy, which covers
  // the page having been copied somewhere else. Both failing reports the FIRST error,
  // since a reader of a normal deployment cares about their own 404, not ours.
  async function fetchArchive(){
    const sources = [DATA_URL, DATA_URL_FALLBACK].filter(Boolean);
    let first = null;
    for (const url of sources){
      try {
        const resp = await fetch(url, { cache: 'no-cache' });
        if (!resp.ok) throw new Error('the archive returned HTTP ' + resp.status);
        return await resp.json();
      } catch (err) {
        if (!first) first = err;
      }
    }
    throw first || new Error('the archive could not be reached');
  }

  async function loadArchive(){
    // Opened straight off disk, fetch is blocked by the browser, not by us.
    // Say so plainly instead of rendering an empty board.
    if (location.protocol === 'file:'){
      renderNeedsServer();
      return false;
    }
    try {
      const payload = await fetchArchive();
      const list = normalise(payload);
      if (!list.length) throw new Error('the archive loaded but contains no gatherings');
      DATA = list;
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ at: new Date().toISOString(), payload }));
      } catch { /* private browsing, or storage full - not worth failing over */ }
      clearNotice();
      return true;
    } catch (err) {
      const cached = readCache();
      if (cached){
        DATA = normalise(cached.payload);
        if (DATA.length){ renderStale(cached.at); return true; }
      }
      renderUnavailable(err);
      return false;
    }
  }

  // ------------------------------------------------------------------- notices
  function clearNotice(){ $notice.innerHTML = ''; }

  function renderStale(at){
    let when = 'earlier';
    try { when = new Date(at).toLocaleString(); } catch {}
    $notice.innerHTML = `
      <div role="status" class="bg-amber-50 border-b border-amber-300 px-6 py-3 text-sm text-amber-900">
        <strong>Showing a saved copy.</strong> The live archive could not be reached just now,
        so this is the version last loaded on ${esc(when)}. Anything added since is missing.
        <button id="notice-retry" class="underline font-medium ml-1">Try again</button>
      </div>`;
    wireRetry();
  }

  function renderUnavailable(err){
    $app.innerHTML = `
      <main class="max-w-2xl mx-auto px-6 py-20 text-center">
        <h1 class="font-serif text-3xl text-lyceum-900">The archive could not be loaded</h1>
        <p class="mt-4 text-stone-600">
          The Lyceum's gatherings are stored in a file this page reads when it opens, and that
          file could not be reached. Nothing has been lost - this is a loading problem, not a
          data problem.
        </p>
        <p class="mt-4 text-sm text-stone-500">Reported reason: ${esc(err && err.message || String(err))}</p>
        <button id="notice-retry"
          class="mt-6 rounded-lg bg-lyceum-800 text-white px-4 py-2 text-sm hover:bg-lyceum-900">
          Try again
        </button>
      </main>`;
    wireRetry();
  }

  function renderNeedsServer(){
    $app.innerHTML = `
      <main class="max-w-2xl mx-auto px-6 py-20">
        <h1 class="font-serif text-3xl text-lyceum-900">This page needs to be served, not opened</h1>
        <p class="mt-4 text-stone-600">
          The board reads its content from a separate file, and browsers refuse that when a page
          is opened directly off the disk. It is a browser security rule, not a fault in the page.
        </p>
        <p class="mt-4 text-stone-600">To preview it locally, run this in the project folder:</p>
        <pre class="mt-3 rounded-lg bg-lyceum-100 text-lyceum-900 p-4 text-sm overflow-x-auto">python3 -m http.server 8000</pre>
        <p class="mt-3 text-stone-600">
          then open <span class="font-mono text-sm">http://localhost:8000</span>.
        </p>
        <p class="mt-6 text-sm text-stone-500">
          The published board needs none of this - it is already being served.
        </p>
      </main>`;
  }

  function wireRetry(){
    const b = document.getElementById('notice-retry');
    if (b) b.addEventListener('click', async () => { if (await loadArchive()) route(); });
  }
  const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
  const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
  // sections that hold list content, in display order
  const SECTIONS = [
    ['theories',      'Theories / Concepts',     'Framing the issue and what we already know'],
    ['applications',  'Application',             'How this is handled around the world'],
    ['sources',       'Source / Input',          'What and who we need for shared understanding'],
    ['policies',      'Regulations / References', 'Policies, laws and resources raised'],
    ['opportunities', 'Opportunities',           'What is favourable for us'],
    ['challenges',    'Challenges',              'The obstacles, perceived or real'],
  ];
  // A reflection revisits earlier gatherings rather than working one question, so it
  // carries different blocks and a title instead of an inquiry. Treating it as an
  // inquiry with six empty sections would label the fullest record in the archive
  // "Help Wanted".
  const REFLECTION_BLOCKS = [
    ['learned',       'What the circle learned'],
    ['carried',       'What is being carried forward'],
    ['changed',       'What changed'],
    ['openQuestions', 'Questions left open'],
  ];
  const isReflection = d => d.kind === 'reflection';
  const titleOf = d => d.inquiry || d.title || '';
  const hasContent = d => isReflection(d)
    ? (d.reviewed || []).length > 0 || REFLECTION_BLOCKS.some(([k]) => (d[k] || []).length)
    : SECTIONS.some(([k]) => (d[k] || []).length);

  // Two gatherings were never recorded. What is known about them comes from the
  // November 2024 reflection, which recapped each one section by section. They carry
  // content, so they are not open quests - but they were never transcribed, and the
  // badge and the counter must not claim otherwise. `recapOf` names the record the
  // content came from, which is both the signal and the link.
  const fromRecap = d => !!d.recapOf;
  const isTranscribed = d => hasContent(d) && !fromRecap(d);

  // --------------------------------------------------- local "living" storage
  // For the MVP, contributions + comments live in the browser (localStorage).
  // In production these become API calls - see README "Way Ahead".
  const store = {
    comments(id){ try { return JSON.parse(localStorage.getItem('lyc.comments.'+id)) || []; } catch { return []; } },
    addComment(id, c){ const all = store.comments(id); all.push(c); localStorage.setItem('lyc.comments.'+id, JSON.stringify(all)); },
    suggestions(id){ try { return JSON.parse(localStorage.getItem('lyc.suggest.'+id)) || []; } catch { return []; } },
    addSuggestion(id, s){ const all = store.suggestions(id); all.push(s); localStorage.setItem('lyc.suggest.'+id, JSON.stringify(all)); },
  };

  // ------------------------------------------------------------------- search
  // One substring match over the whole record was the original behaviour, and it fails
  // the way people actually search. Typing "rabbi" worked; typing "community, DEI,
  // Services" returned nothing, because the whole phrase was looked for as one string.
  //
  // So the query is split into terms and EVERY term must appear somewhere in the record.
  // Each word you add narrows the list, which is the behaviour a search box implies.
  // Commas are separators rather than characters to match, because that is how people
  // type a list.
  function searchTerms(s){
    return String(s || '').toLowerCase().split(/[\s,;]+/).filter(Boolean);
  }

  // Everything about a record that a search should see, lowercased once and cached -
  // it is rebuilt on every keystroke otherwise, for every record, across 1,100 items.
  const _hay = new WeakMap();
  function haystackOf(d){
    let h = _hay.get(d);
    if (h !== undefined) return h;
    // inquiryAliases carries earlier wordings of the question, so someone who remembers
    // it the old way still finds the gathering.
    const reflectionText = isReflection(d)
      ? [...(d.reviewed || []).flatMap(r => [r.topic, r.discussion, r.progress]),
         ...REFLECTION_BLOCKS.flatMap(([k]) => (d[k] || []).map(itemText)), d.summary]
      : [];
    const sb = d.storyboard || {};
    h = [titleOf(d), ...(d.inquiryAliases||[]), ...(d.tags||[]), ...sectionItems(d),
         ...reflectionText, d.quote, d.callToAction,
         // The storyboard is where the narrative detail lives, so a word spoken in the
         // room but not in a bullet was previously unfindable.
         sb.logline, ...beatsOf(d).flatMap(b => [b.title, b.summary, b.pullQuote]),
        ].filter(Boolean).join(' ').toLowerCase();
    _hay.set(d, h);
    return h;
  }

  // --------------------------------------------------- an item and its moment
  // "@1:07:44" or "@47:32" as seconds. Returns null for a range or a malformed value,
  // so a synthesised item that carries no single timestamp simply does not link.
  function atSecs(s){
    const m = String(s || '').match(/^@?(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (!m) return null;
    const p = [m[1], m[2], m[3]].filter(x => x != null).map(Number);
    return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
  }

  // The beat whose time range contains this moment. This is the whole of the
  // "link a comment to its context" request: items already carry `at` and beats already
  // carry `timeRange`, so the two join with no new data and no recording.
  function beatAt(d, at){
    const s = atSecs(at);
    if (s == null) return null;
    return beatsOf(d).find(b => {
      const [lo, hi] = String(b.timeRange || '').split('-').map(x => atSecs(x.trim()));
      return lo != null && hi != null && s >= lo && s <= hi;
    }) || null;
  }

  // ------------------------------------------------------------------ routing
  function route(){
    // A hash that is not a route and does name something on this page is an in-page jump,
    // so leave the page alone and let the browser scroll. Without this the router falls
    // through to renderIndex and throws away the page the reader is standing on - which
    // is exactly what "Read it in full" did, because the first version of this guard only
    // recognised #beat-N and that link points at #storyboard. Match the shape rather than
    // a list of ids, so the next anchor added does not reintroduce the bug.
    const hash = location.hash || '';
    if (hash && !hash.startsWith('#/') && document.getElementById(hash.slice(1))) return;

    const m = hash.match(/^#\/inquiry\/(.+)$/);
    if (m){
      // idAliases keeps a previously published link working when a record's id has to
      // change - the 2025-04-27 gathering was dated 28 April until its recording was found.
      const want = m[1];
      const d = DATA.find(x => x.id === want)
             || DATA.find(x => (x.idAliases || []).includes(want));
      if (d) return renderDetail(d);
    }
    renderIndex();
  }
  window.addEventListener('hashchange', route);

  // In-page jumps to a storyboard beat, handled here rather than natively so the hash
  // never changes - the router treats a hash change as navigation. The links keep a real
  // href, so they still mean something to a middle-click and to assistive technology.
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[data-jump]');
    if (!a) return;
    const el = document.getElementById(a.getAttribute('data-jump'));
    if (!el) return;
    e.preventDefault();
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' });
    // Scrolling to a beat that looks like every other beat reads as nothing having
    // happened, so mark where the reader landed and then get out of the way.
    el.classList.add('ring-2', 'ring-lyceum-700', 'rounded-lg');
    setTimeout(() => el.classList.remove('ring-2', 'ring-lyceum-700', 'rounded-lg'), 1800);
  });

  // -------------------------------------------------------------- index page
  let query = '';
  function renderIndex(){
    const terms = searchTerms(query);
    const matches = DATA.filter(d => terms.every(t => haystackOf(d).includes(t)));

    // Which terms found nothing anywhere. "DEI matched nothing" is a different message
    // from "no gathering has all of these", and only the first tells a reader what to
    // change about their search.
    const missing = terms.filter(t => !DATA.some(d => haystackOf(d).includes(t)));
    const done = DATA.filter(isTranscribed).length;

    $app.innerHTML = `
      <header class="bg-lyceum-900 text-lyceum-50">
        <div class="max-w-5xl mx-auto px-6 py-12">
          <div class="flex items-center gap-3 mb-3">
            <!-- The star is white on transparent, so it reads on this dark header and
                 nowhere else on the page. Decorative: the wordmark beside it already
                 carries the name, so an alt text would just repeat it to a screen
                 reader. -->
            <img src="./StarLogo.png" alt="" width="28" height="27" class="shrink-0 opacity-90" />
            <p class="uppercase tracking-[0.3em] text-xs text-lyceum-100/80">Praxium Learning Foundation</p>
          </div>
          <h1 class="font-serif text-4xl sm:text-5xl font-bold">The Lyceum</h1>
          <p class="mt-3 text-lg text-lyceum-100/90 max-w-2xl">An endeavor for shared purpose in families and communities. Every gathering, we take a real question and work it through together - framing it, learning how the world handles it, and deciding who carries it forward.</p>
          <div class="mt-6 flex flex-wrap gap-x-8 gap-y-2 text-sm text-lyceum-100/80">
            <span><strong class="text-white">${DATA.length}</strong> gatherings</span>
            <span><strong class="text-white">${done}</strong> inquiries transcribed</span>
            <span><strong class="text-white">${DATA.filter(isQuest).length}</strong> open quests - help wanted</span>
          </div>
        </div>
      </header>

      <main class="max-w-5xl mx-auto px-6 py-8">
        <div class="mb-6">
          <input id="search" type="search" value="${esc(query)}" placeholder="Search several words at once - community growth outreach"
            class="w-full rounded-lg border border-lyceum-100 bg-white px-4 py-3 text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-lyceum-700" />
          <p class="mt-2 text-sm text-stone-500">
            ${matches.length} of ${DATA.length} gatherings${terms.length
              ? ` matching ${terms.map(t => `<span class="font-medium text-lyceum-800">${esc(t)}</span>`).join(' + ')}`
              : ''}${missing.length
              ? ` - nothing in the archive mentions ${missing.map(t => `<span class="font-medium text-stone-700">${esc(t)}</span>`).join(' or ')}`
              : ''}
          </p>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          ${matches.map(cardHTML).join('') || noMatchHTML(terms, missing)}
        </div>

        <footer class="mt-16 border-t border-lyceum-100 pt-6 text-sm text-stone-500">
          A living archive - anyone in the community can read, search, comment, and suggest edits. Built from the original Lyceum slide decks.
        </footer>
      </main>`;

    const s = document.getElementById('search');
    s.addEventListener('input', e => { query = e.target.value; renderIndex(); placeCursorEnd(document.getElementById('search')); });
    placeCursorEnd(s);
  }

  function placeCursorEnd(el){ if(!el) return; el.focus(); const v = el.value; el.value=''; el.value=v; }

  // "No inquiries match that search" is true and useless. Because every term has to
  // match, a search can go blank for two quite different reasons, and the reader can only
  // act on the difference: either a word appears nowhere in the archive, or every word
  // appears but never in the same gathering. Show the per-term counts and it is obvious
  // which - and obvious which word to drop.
  function noMatchHTML(terms, missing){
    if (!terms.length) return '';
    const counts = terms.map(t => ({
      t, n: DATA.filter(d => haystackOf(d).includes(t)).length,
    }));
    return `
      <div class="col-span-2 py-10 text-center text-stone-500">
        <p class="text-stone-600">No single gathering mentions all of these.</p>
        ${missing.length
          ? `<p class="mt-2 text-sm">Nothing in the archive mentions
               ${missing.map(t => `<strong class="text-stone-700">${esc(t)}</strong>`).join(' or ')}.</p>`
          : `<p class="mt-2 text-sm">Each word appears on its own, just never together.</p>`}
        <ul class="mt-4 inline-flex flex-wrap justify-center gap-2 text-sm">
          ${counts.map(c => `
            <li class="rounded-full border border-lyceum-100 bg-white px-3 py-1">
              <span class="font-medium text-lyceum-800">${esc(c.t)}</span>
              <span class="text-stone-500">${c.n === 0 ? 'not found' : c.n + ' ' + plural(c.n, 'gathering')}</span>
            </li>`).join('')}
        </ul>
        <p class="mt-4 text-sm">Drop a word to widen the search.</p>
      </div>`;
  }

  function isQuest(d){ return d.status !== 'founding' && !hasContent(d); }
  function badge(d){
    if (isReflection(d)) return '<span class="text-xs rounded-full bg-lyceum-100 text-lyceum-800 px-2 py-0.5">Reflection</span>';
    if (d.status === 'founding') return '<span class="text-xs rounded-full bg-lyceum-100 text-lyceum-800 px-2 py-0.5">Founding</span>';
    if (fromRecap(d))            return '<span class="text-xs rounded-full bg-sky-100 text-sky-800 px-2 py-0.5">From recap</span>';
    if (isTranscribed(d))        return '<span class="text-xs rounded-full bg-emerald-100 text-emerald-800 px-2 py-0.5">Transcribed</span>';
    return '<span class="text-xs rounded-full bg-amber-100 text-amber-800 px-2 py-0.5 font-medium">Help Wanted</span>';
  }

  // ------------------------------------------- the gathering as an event (v2)
  // Schema v2 records carry a `meeting` block and a `storyboard`. Older records
  // carry neither, so each of these returns nothing rather than an empty shell.

  function beatsOf(d){ return (d.storyboard && d.storyboard.beats) || []; }

  // How many people were in the circle. The record does not name participants at
  // all - see "The record says what, not who" in docs/DATA-NOTES.md - so this reads
  // a count, and falls back to counting a legacy attendee list if one is present.
  function circleSize(m){
    if (!m) return 0;
    const named = Array.isArray(m.attendees) ? m.attendees.length : 0;
    return (Number(m.participants) || named) + (Number(m.minorsPresent) || 0);
  }

  function plural(n, one, many){ return n === 1 ? one : (many || one + 's'); }

  // The extra line on a card for a gathering we hold a real record of.
  function cardMetaHTML(d){
    const m = d.meeting, beats = beatsOf(d), bits = [];
    const people = circleSize(m);
    if (people)                    bits.push(people + ' in the circle');
    if (m && (m.locations||[]).length) bits.push((m.locations.length) + ' ' + plural(m.locations.length, 'location'));
    if (beats.length)              bits.push(beats.length + '-part storyboard');
    if (!bits.length) return '';
    return `
        <div class="mt-3 pt-3 border-t border-lyceum-100 text-xs text-stone-500">
          ${bits.map(esc).join(' / ')}
        </div>`;
  }

  function cardHTML(d){
    return `
      <a href="#/inquiry/${d.id}" class="block rounded-xl bg-white border border-lyceum-100 p-5 shadow-sm hover:shadow-md hover:border-lyceum-700/40 transition">
        <div class="flex items-center justify-between mb-2">
          <time class="text-xs uppercase tracking-wide text-stone-400">${fmtDate(d.date)}</time>
          ${badge(d)}
        </div>
        <h3 class="font-serif text-lg leading-snug text-lyceum-900">${esc(titleOf(d))}</h3>
        <div class="mt-3 flex flex-wrap gap-1.5">
          ${(d.tags||[]).map(t => `<span class="text-xs bg-lyceum-50 border border-lyceum-100 text-lyceum-800 rounded px-2 py-0.5">${esc(t)}</span>`).join('')}
        </div>
        ${cardMetaHTML(d)}
        ${isQuest(d) ? `<div class="mt-3 flex items-center gap-1.5 text-xs font-medium text-amber-700">Open quest - help explore this inquiry</div>` : ''}
      </a>`;
  }

  // ------------------------------------------------------------- storyboard
  // The beat-by-beat arc of the gathering. This is what the six static sections
  // cannot convey: the order things happened in, and where the discussion turned.
  // The storyboard, at the top, before any of the granular data.
  //
  // The ask was for an image of the deck slide up front, so a visitor meets the shape of
  // the evening and can decide whether to read on. This draws it from the beats instead,
  // which every record now carries: it stays searchable, reads on a phone, needs no
  // export when a record changes, and a screen reader can follow it. `storyboard.image`
  // is honoured if a deck PNG is ever added, so both routes work.
  function storyboardTopHTML(d){
    const sb = d.storyboard || {}, beats = beatsOf(d);
    if (!beats.length && !sb.image) return '';
    return `
      <section class="mt-6 rounded-xl border border-lyceum-100 bg-white p-5 shadow-sm">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h2 class="font-serif text-xl text-lyceum-900">The shape of the evening</h2>
          ${beats.length ? `<a href="#storyboard" data-jump="storyboard"
            class="text-xs text-lyceum-700 hover:underline">Read it in full</a>` : ''}
        </div>
        ${sb.logline ? `<p class="mt-2 text-stone-700">${esc(sb.logline)}</p>` : ''}
        ${sb.image ? `
          <img src="${esc(sb.image)}" alt="Storyboard for this gathering"
               class="mt-4 w-full rounded-lg border border-lyceum-100" />` : ''}
        ${beats.length ? `
          <ol class="mt-4 flex gap-2 overflow-x-auto pb-2 -mx-1 px-1">
            ${beats.map(b => `
              <li class="shrink-0 w-44">
                <a href="#beat-${b.n}" data-jump="beat-${b.n}"
                   class="block h-full rounded-lg border border-lyceum-100 bg-lyceum-50 p-3
                          hover:border-lyceum-700/40 hover:bg-white transition">
                  <span class="block text-[10px] uppercase tracking-wider text-stone-400 tabular-nums">
                    ${b.n}${b.timeRange ? ' &middot; ' + esc(b.timeRange) : ''}
                  </span>
                  <span class="mt-1 block font-serif text-sm leading-snug text-lyceum-900">
                    ${esc(b.title || '')}
                  </span>
                </a>
              </li>`).join('')}
          </ol>
          <p class="mt-1 text-xs text-stone-400">${beats.length} beats - scroll sideways, or pick one to jump to it.</p>` : ''}
      </section>`;
  }

  function storyboardHTML(d){
    const sb = d.storyboard, beats = beatsOf(d);
    if (!beats.length) return '';
    return `
      <section id="storyboard" class="mt-10 scroll-mt-6">
        <h2 class="font-serif text-2xl text-lyceum-900">How the evening unfolded</h2>
        ${sb.logline ? `<p class="mt-2 text-stone-600">${esc(sb.logline)}</p>` : ''}
        <ol class="mt-5 border-l border-lyceum-100 pl-5 space-y-6">
          ${beats.map(b => `
            <li id="beat-${b.n}" class="scroll-mt-6">
              <div class="flex flex-wrap items-baseline gap-x-3">
                ${b.timeRange ? `<span class="text-xs text-stone-400 whitespace-nowrap tabular-nums">${esc(b.timeRange)}</span>` : ''}
                <h3 class="font-serif text-lg text-lyceum-900">${esc(b.title || '')}</h3>
              </div>
              ${b.summary ? `<p class="mt-1 text-sm text-stone-700">${esc(b.summary)}</p>` : ''}
              ${b.pullQuote ? `<blockquote class="mt-2 border-l-2 border-lyceum-700 pl-3 text-sm italic text-lyceum-800">"${esc(b.pullQuote)}"</blockquote>` : ''}
            </li>`).join('')}
        </ol>
        ${sb.arcNotes ? `
          <p class="mt-5 rounded-xl bg-lyceum-50 border border-lyceum-100 p-4 text-sm text-stone-700">${esc(sb.arcNotes)}</p>` : ''}
      </section>`;
  }

  // -------------------------------------------------- about this gathering
  // Collapsed by default: it is reference material about the occasion, not the
  // substance of the inquiry, and the page should open on the substance.
  function aboutMeetingHTML(d){
    const m = d.meeting;
    if (!m) return '';
    const rows = [];
    const people = circleSize(m);
    if (people){
      const minors = Number(m.minorsPresent) || 0;
      rows.push(['In the circle',
        `${people} ${plural(people, 'participant')}` +
        (minors ? `, including ${minors} young ${plural(minors, 'participant')}` : '')]);
    }
    if ((m.locations||[]).length)   rows.push(['Joining from', m.locations.map(esc).join(', ')]);
    if (m.landAcknowledgement)      rows.push(['Land acknowledgement', esc(m.landAcknowledgement)]);
    if ((m.agenda||[]).length)      rows.push(['Running order', m.agenda.map(esc).join('; ')]);
    if ((m.surveyPre||[]).length)   rows.push(['Opening survey', m.surveyPre.map(s => '"' + esc(s) + '"').join(' ')]);
    if ((m.surveyPost||[]).length)  rows.push(['Closing survey', m.surveyPost.map(s => '"' + esc(s) + '"').join(' ')]);
    if ((m.contextNotes||[]).length) rows.push(['Notes', m.contextNotes.map(esc).join(' ')]);
    if (!rows.length) return '';

    return `
      <details class="mt-8 rounded-xl bg-white border border-lyceum-100 shadow-sm">
        <summary class="cursor-pointer px-5 py-4 font-serif text-lg text-lyceum-900">About this gathering</summary>
        <dl class="px-5 pb-5 grid gap-x-5 gap-y-2 sm:grid-cols-[10rem_1fr] text-sm">
          ${rows.map(([k,v]) => `
            <dt class="text-stone-500">${esc(k)}</dt>
            <dd class="text-stone-700">${v}</dd>`).join('')}
        </dl>
      </details>`;
  }

  // -------------------------------------------------------------- detail page
  function renderDetail(d){
    const transcribed = hasContent(d);
    $app.innerHTML = `
      <header class="bg-lyceum-900 text-lyceum-50">
        <div class="max-w-3xl mx-auto px-6 py-10">
          <a href="#/" class="text-sm text-lyceum-100/80 hover:text-white">Back to all inquiries</a>
          <p class="mt-4 uppercase tracking-[0.25em] text-xs text-lyceum-100/70">${fmtDate(d.date)} - ${isReflection(d) ? 'Reflection' : 'Sequence of Inquiry'}</p>
          <h1 class="font-serif text-3xl sm:text-4xl font-bold mt-2">${esc(titleOf(d))}</h1>
          <div class="mt-4 flex flex-wrap gap-1.5">
            ${(d.tags||[]).map(t => `<span class="text-xs bg-white/10 rounded px-2 py-0.5">${esc(t)}</span>`).join('')}
          </div>
          ${detailMetaHTML(d)}
        </div>
      </header>

      <main class="max-w-3xl mx-auto px-6 py-8 fade-in">
        ${!transcribed ? notYetHTML(d) : ''}
        ${fromRecap(d) ? fromRecapHTML(d) : ''}
        ${d.quote ? `
          <blockquote class="font-serif text-xl italic text-lyceum-800 border-l-4 border-lyceum-700 pl-5 my-2">
            "${esc(d.quote)}"
          </blockquote>` : ''}

        ${storyboardTopHTML(d)}

        ${isReflection(d) ? reflectionHTML(d) : `
        <div class="grid gap-4 sm:grid-cols-2 mt-6">
          ${SECTIONS.map(([k,t,sub]) => sectionHTML(d, d[k]||[], t, sub)).join('')}
        </div>`}

        ${d.callToAction ? `
          <section class="mt-6 rounded-xl border border-amber-300 bg-amber-50 p-5">
            <h3 class="font-semibold text-amber-900">Way Ahead - Call to Action</h3>
            <p class="mt-1 text-amber-900/90">${esc(d.callToAction)}</p>
          </section>` : ''}

        ${d.withheld ? `
          <p class="mt-8 rounded-xl bg-lyceum-50 border border-lyceum-100 p-4 text-xs text-stone-600">
            ${esc(d.withheld)}
          </p>` : ''}

        ${storyboardHTML(d)}
        ${aboutMeetingHTML(d)}
        ${provenanceHTML(d)}

        ${suggestHTML(d)}
        ${commentsHTML(d)}
      </main>`;

    wireDetail(d);
  }

  // The line under the title on a detail page: who guided it, how many took part.
  function detailMetaHTML(d){
    const m = d.meeting, beats = beatsOf(d), bits = [];
    const people = circleSize(m);
    if (people)              bits.push(people + ' in the circle');
    if (beats.length)        bits.push('storyboard below');
    if (!bits.length) return '';
    return `
          <p class="mt-4 text-sm text-lyceum-100/80">${bits.map(esc).join(' / ')}</p>`;
  }

  // Where this record came from and who checked it. An unreviewed record says so
  // rather than presenting itself as verified - see docs/DATA-NOTES.md.
  function provenanceHTML(d){
    const p = d.provenance;
    if (!p) return '';
    const bits = [];
    if (p.source)      bits.push('Compiled from ' + p.source + '.');
    if (p.extractedOn) bits.push('Extracted ' + p.extractedOn + '.');
    bits.push(p.reviewedBy
      ? 'Checked against the recording by ' + p.reviewedBy + '.'
      : 'Not yet checked against the recording by a second person.');
    if (p.note) bits.push(p.note);
    return `
        <p class="mt-6 text-xs text-stone-400">${bits.map(esc).join(' ')}</p>`;
  }

  // A reflection's spine is the gatherings it revisited, each linking back to that
  // record so the two are navigable together.
  function reflectionHTML(d){
    const rev = d.reviewed || [];
    return `
      ${d.summary ? `<p class="mt-2 text-lg text-stone-700">${esc(d.summary)}</p>` : ''}

      ${rev.length ? `
        <section class="mt-8">
          <h2 class="font-serif text-2xl text-lyceum-900">The gatherings revisited</h2>
          <div class="mt-4 space-y-4">
            ${rev.map(r => {
              const linked = r.date && DATA.find(x => x.date === r.date && x.id !== d.id);
              return `
              <article class="rounded-xl bg-white border border-lyceum-100 p-5 shadow-sm">
                <div class="flex flex-wrap items-baseline justify-between gap-x-3">
                  <h3 class="font-serif text-lg text-lyceum-900">${esc(r.topic || '')}</h3>
                  ${linked
                    ? `<a href="#/inquiry/${linked.id}" class="text-xs text-lyceum-700 hover:underline whitespace-nowrap">${fmtDate(r.date)} - open</a>`
                    : (r.date ? `<time class="text-xs text-stone-400 whitespace-nowrap">${fmtDate(r.date)}</time>` : '')}
                </div>
                ${r.discussion ? `<p class="mt-2 text-sm text-stone-700">${esc(r.discussion)}</p>` : ''}
                ${r.progress ? `
                  <p class="mt-3 rounded-lg bg-lyceum-50 border border-lyceum-100 p-3 text-sm text-stone-700">
                    <span class="font-semibold text-lyceum-900">What had happened since. </span>${esc(r.progress)}
                  </p>` : ''}
              </article>`;
            }).join('')}
          </div>
        </section>` : ''}

      <div class="grid gap-4 sm:grid-cols-2 mt-8">
        ${REFLECTION_BLOCKS.map(([k, t]) => sectionHTML(d, d[k] || [], t, 'Nothing recorded')).join('')}
      </div>`;
  }

  // An item, with a link back to the moment it came from where one can be resolved.
  // This is the "see the context that wrapped around it" request: the bullet is the
  // finding, the beat is the stretch of the evening it was said in.
  function itemHTML(d, i){
    const at = (i && typeof i === 'object') ? i.at : null;
    if (!at) return `<li>${itemText(i)}</li>`;
    const b = beatAt(d, at);
    const stamp = b
      ? ` <a href="#beat-${b.n}" data-jump="beat-${b.n}"
             title="In context: ${esc(b.title || ('beat ' + b.n))}"
             class="whitespace-nowrap text-xs tabular-nums text-lyceum-700 hover:underline">${esc(at)}</a>`
      // No beat covers it, so the timestamp still tells the reader when, but promises
      // no destination.
      : ` <span class="whitespace-nowrap text-xs tabular-nums text-stone-400">${esc(at)}</span>`;
    return `<li>${itemText(i)}${stamp}</li>`;
  }

  function sectionHTML(d, items, title, sub){
    return `
      <section class="rounded-xl bg-white border border-lyceum-100 p-4 shadow-sm">
        <h3 class="font-semibold text-lyceum-900">${title}</h3>
        ${items.length
          ? `<ul class="mt-2 space-y-1.5 text-sm list-disc list-inside marker:text-lyceum-700">${items.map(i => itemHTML(d, i)).join('')}</ul>`
          : `<p class="mt-2 text-sm text-stone-400 italic">${sub} - not captured yet.</p>`}
      </section>`;
  }

  function notYetHTML(d){
    return `
      <div class="rounded-xl border border-amber-300 bg-amber-50 p-5 mb-6">
        <div class="flex items-center gap-2">
          <span class="text-xs rounded-full bg-amber-100 text-amber-800 px-2 py-0.5 font-medium">Help Wanted</span>
          <h2 class="font-semibold text-amber-900">This inquiry is an open quest</h2>
        </div>
        <p class="mt-2 text-sm text-amber-900/90">This question was explored in the circle, but the notes still live in the old slide deck. Take up the quest: if you were there - or want to dig into it - use <strong>Suggest content</strong> below to start filling it in. Every contribution moves the inquiry forward and turns the archive into a living document.</p>
      </div>`;
  }

  // No recording of this gathering exists, so its content is second-hand: the
  // November 2024 reflection walked the storyboard section by section, and that recap
  // is the whole source. Say so on the page rather than letting the sections imply a
  // transcript that was never made.
  function fromRecapHTML(d){
    const src = d.recapOf
      ? `<a class="underline hover:no-underline" href="#/inquiry/${esc(d.recapOf)}">the reflection that revisited it</a>`
      : 'a later reflection';
    return `
      <div class="rounded-xl border border-sky-300 bg-sky-50 p-5 mb-6">
        <div class="flex items-center gap-2">
          <span class="text-xs rounded-full bg-sky-100 text-sky-800 px-2 py-0.5 font-medium">From recap</span>
          <h2 class="font-semibold text-sky-900">This gathering was not recorded</h2>
        </div>
        <p class="mt-2 text-sm text-sky-900/90">Everything below is drawn from ${src}, where the circle walked this storyboard again section by section. It is a faithful summary rather than a transcript, so it is thinner than the recorded gatherings and carries no timestamps. If you were there and remember more, <strong>Suggest content</strong> below.</p>
      </div>`;
  }

  // -------------------------------------------------- suggest-an-edit (living)
  function suggestHTML(d){
    const subs = store.suggestions(d.id);
    return `
      <section class="mt-10 rounded-xl bg-white border border-lyceum-100 p-5 shadow-sm">
        <h3 class="font-serif text-lg text-lyceum-900">Suggest content or an edit</h3>
        <p class="text-sm text-stone-500 mt-1">Propose an addition to any part of this inquiry. Suggestions are recorded with your name and the date - the seed of community version control.</p>
        <form id="suggest-form" class="mt-4 grid gap-3 sm:grid-cols-2">
          <input name="name" placeholder="Your name" class="rounded-lg border border-lyceum-100 px-3 py-2 text-sm" required />
          <select name="section" class="rounded-lg border border-lyceum-100 px-3 py-2 text-sm">
            ${(isReflection(d) ? REFLECTION_BLOCKS : SECTIONS.map(([k,t]) => [k,t]))
                .map(([k,t]) => `<option value="${k}">${t}</option>`).join('')}
            <option value="quote">Highlighted quote</option>
            ${isReflection(d)
              ? '<option value="reviewed">A gathering revisited</option>'
              : '<option value="callToAction">Way Ahead / Call to Action</option>'}
          </select>
          <textarea name="text" placeholder="Your suggested wording..." class="sm:col-span-2 rounded-lg border border-lyceum-100 px-3 py-2 text-sm" rows="3" required></textarea>
          <div class="sm:col-span-2"><button class="rounded-lg bg-lyceum-800 text-white px-4 py-2 text-sm hover:bg-lyceum-900">Submit suggestion</button></div>
        </form>
        ${subs.length ? `
          <div class="mt-5 border-t border-lyceum-100 pt-4">
            <h4 class="text-sm font-semibold text-stone-600 mb-2">Pending suggestions (${subs.length})</h4>
            <ul class="space-y-2 text-sm">
              ${subs.map(s => `<li class="rounded-lg bg-lyceum-50 p-3"><span class="font-medium">${esc(s.name)}</span> to <em>${esc(sectionLabel(s.section))}</em><br>${esc(s.text)}<div class="text-xs text-stone-400 mt-1">${esc(s.at)}</div></li>`).join('')}
            </ul>
          </div>` : ''}
      </section>`;
  }
  function sectionLabel(k){
    const f = SECTIONS.find(s => s[0]===k) || REFLECTION_BLOCKS.find(s => s[0]===k);
    if (f) return f[1];
    return k==='callToAction' ? 'Way Ahead' : k==='reviewed' ? 'A gathering revisited' : k;
  }

  // ----------------------------------------------------------------- comments
  function commentsHTML(d){
    const cs = store.comments(d.id);
    return `
      <section class="mt-8 rounded-xl bg-white border border-lyceum-100 p-5 shadow-sm">
        <h3 class="font-serif text-lg text-lyceum-900">Discussion (${cs.length})</h3>
        <form id="comment-form" class="mt-3 grid gap-3">
          <input name="name" placeholder="Your name" class="rounded-lg border border-lyceum-100 px-3 py-2 text-sm" required />
          <textarea name="text" placeholder="Add your reflection or a Lima/Peru example..." class="rounded-lg border border-lyceum-100 px-3 py-2 text-sm" rows="2" required></textarea>
          <div><button class="rounded-lg bg-lyceum-700 text-white px-4 py-2 text-sm hover:bg-lyceum-800">Post comment</button></div>
        </form>
        <ul class="mt-5 space-y-3">
          ${cs.length ? cs.map(c => `
            <li class="border-l-2 border-lyceum-100 pl-3">
              <div class="text-sm"><span class="font-medium text-lyceum-900">${esc(c.name)}</span> <span class="text-xs text-stone-400">- ${esc(c.at)}</span></div>
              <p class="text-sm text-stone-700">${esc(c.text)}</p>
            </li>`).join('')
          : '<li class="text-sm text-stone-400 italic">No comments yet - be the first to reflect.</li>'}
        </ul>
      </section>`;
  }

  function wireDetail(d){
    const today = new Date().toLocaleDateString();
    const cf = document.getElementById('comment-form');
    cf && cf.addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target;
      store.addComment(d.id, { name: f.name.value.trim(), text: f.text.value.trim(), at: today });
      renderDetail(d);
    });
    const sf = document.getElementById('suggest-form');
    sf && sf.addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target;
      store.addSuggestion(d.id, { name: f.name.value.trim(), section: f.section.value, text: f.text.value.trim(), at: today });
      renderDetail(d);
    });
  }

  // ------------------------------------------------------------------- launch
  // Styling first: if this page has been copied to another origin, the relative
  // stylesheet is unreachable and everything below would render as raw HTML.
  ensureStylesheet();
  loadArchive().then(ok => { if (ok) route(); });
  </script>
</body>
</html>
